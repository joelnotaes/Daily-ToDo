<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kenvelo Daily Planner</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#334155">
<style>
  :root {
    --slate-50:#f8fafc; --slate-100:#f1f5f9; --slate-200:#e2e8f0; --slate-300:#cbd5e1;
    --slate-400:#94a3b8; --slate-500:#64748b; --slate-700:#334155; --slate-800:#1e293b;
    --red-400:#f87171; --red-500:#ef4444;
    --kb-offset: 0px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--slate-50);
  }
  #planner-root {
    height: 100vh; width: 100%; background: #fff; display: flex; flex-direction: column;
    max-width: 448px; margin: 0 auto; border-left: 1px solid var(--slate-100); border-right: 1px solid var(--slate-100);
    overflow: hidden;
  }
  #planner-scroll {
    flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column;
  }
  .brand {
    text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 0.04em;
    color: var(--slate-700); padding: 10px 16px 0;
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--slate-100);
  }
  .nav-btn {
    padding: 4px; color: var(--slate-400); background: none; border: none; cursor: pointer;
    display: flex; align-items: center; border-radius: 6px;
  }
  .nav-btn:hover { color: var(--slate-700); background: var(--slate-100); }
  .date-label { text-align: center; }
  .date-label p { margin: 0; font-size: 14px; font-weight: 600; color: var(--slate-800); }
  .today-btn {
    font-size: 11px; color: var(--slate-400); background: none; border: none; cursor: pointer; margin-top: 2px;
  }
  .today-btn:hover { color: var(--slate-500); }
  .section { display: flex; flex-direction: column; flex-shrink: 0; }
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px 8px;
  }
  .section-head h2 {
    margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
    color: var(--slate-500); text-transform: uppercase;
  }
  .add-btn {
    color: var(--slate-400); background: none; border: none; cursor: pointer;
    display: flex; align-items: center; gap: 5px; font-size: 15px;
  }
  .add-btn:hover { color: var(--slate-700); }
  .task-list {
    padding: 0 16px 12px;
    scroll-margin-bottom: 60px;
  }
  .empty-hint { font-size: 14px; color: var(--slate-300); font-style: italic; padding: 8px 4px; margin: 0; }
  .task-row {
    display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--slate-100); padding: 6px 0;
  }
  .check-btn {
    width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; border: 1.5px solid var(--slate-300);
    background: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .check-btn.done { background: var(--slate-700); border-color: var(--slate-700); color: #fff; font-size: 10px; }
  .task-text {
    flex: 1; min-width: 0; font-size: 14px; border: none; background: transparent; color: var(--slate-800); outline: none;
  }
  .task-text.done { text-decoration: line-through; color: var(--slate-400); }
  .hour-input {
    width: 44px; text-align: center; font-size: 12px; background: var(--slate-100); border: none; border-radius: 6px;
    padding: 4px; color: var(--slate-500); outline: none;
  }
  .hour-input:focus { box-shadow: 0 0 0 1px var(--slate-400); }
  .del-btn { color: var(--slate-300); background: none; border: none; cursor: pointer; flex-shrink: 0; display:flex; }
  .del-btn:hover { color: var(--red-500); }

  /* Large + button at bottom of each section */
  .big-add {
    display: flex; align-items: center; justify-content: center;
    width: 56px; height: 56px; margin: 14px auto 4px;
    border-radius: 50%; border: 2px solid var(--slate-300);
    background: var(--slate-50); color: var(--slate-500);
    font-size: 34px; line-height: 1; font-weight: 300; cursor: pointer;
    padding: 0; padding-bottom: 3px;
  }
  .big-add:hover, .big-add:active { background: var(--slate-700); border-color: var(--slate-700); color: #fff; }

  .task-menu {
    position: fixed; z-index: 50; background: #fff; border: 1px solid var(--slate-200);
    border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); overflow: hidden;
  }
  .task-menu button {
    display: block; width: 100%; text-align: left; padding: 10px 16px; font-size: 14px;
    background: none; border: none; cursor: pointer; color: var(--slate-800); white-space: nowrap;
  }
  .task-menu button + button { border-top: 1px solid var(--slate-100); }
  .task-menu button:hover { background: var(--slate-100); }
  .task-menu-overlay { position: fixed; inset: 0; z-index: 40; background: transparent; }

  /* Calendar picker */
  .cal-overlay {
    position: fixed; inset: 0; z-index: 60; background: rgba(15,23,42,0.45);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .cal-box {
    background: #fff; border-radius: 14px; width: 100%; max-width: 340px;
    padding: 14px; box-shadow: 0 12px 32px rgba(0,0,0,0.25);
  }
  .cal-title { text-align: center; font-size: 12px; color: var(--slate-500); margin: 0 0 6px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-head span { font-size: 15px; font-weight: 600; color: var(--slate-800); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { text-align: center; font-size: 11px; color: var(--slate-400); padding: 4px 0; }
  .cal-day {
    aspect-ratio: 1; border: none; background: none; border-radius: 50%;
    font-size: 14px; color: var(--slate-800); cursor: pointer; padding: 0;
  }
  .cal-day:hover { background: var(--slate-100); }
  .cal-day.today { border: 1px solid var(--slate-400); }
  .cal-day.current { background: var(--slate-200); color: var(--slate-500); cursor: default; }
  .cal-cancel {
    display: block; width: 100%; margin-top: 10px; padding: 10px; font-size: 14px;
    background: var(--slate-100); border: none; border-radius: 8px; color: var(--slate-700); cursor: pointer;
  }

  .spacer-tap {
    height: calc(56px + var(--kb-offset));
    width: 100%;
    transition: height 0.15s ease;
  }
  .divider { height: 1px; background: var(--slate-200); }
  .status-bar {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    font-size: 11px; padding: 6px 8px; color: var(--slate-400);
    flex-shrink: 0;
  }
  .status-bar.error { color: var(--red-500); cursor: pointer; text-decoration: underline; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
</style>
</head>
<body>
<div id="planner-root"></div>
<script src="auth.js"></script>
<script>
(function() {
  // ---- Supabase connection ----
  const SUPABASE_URL = "https://xxrbbhrvrjjaobahvlaf.supabase.co";
  const SUPABASE_KEY = "sb_publishable_FkMIVN_l0KZy5k99B36ZVA_AJyUzhtl";
  const REST_URL = SUPABASE_URL + "/rest/v1/tasks";
  const sbHeaders = {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json"
  };

  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Math.random().toString(36).slice(2));
  const dateKey = (d) => {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  };
  const fmt = (d) => d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  const emptyTask = () => ({ id: uuid(), text: "", hour: "", done: false });

  const root = document.getElementById("planner-root");
  let current = new Date();
  let work = [];
  let personal = [];
  let saveStatus = "idle"; // idle | pending | saved | error
  let focusId = null;

  // Load all tasks for a given day from Supabase
  async function loadDay(d) {
    const key = dateKey(d);
    try {
      const res = await fetch(`${REST_URL}?date=eq.${key}&select=*`, { headers: sbHeaders });
      if (!res.ok) throw new Error("load failed");
      const rows = await res.json();
      work = rows.filter(r => r.section === "work").map(rowToTask);
      personal = rows.filter(r => r.section === "personal").map(rowToTask);
    } catch (e) {
      work = []; personal = [];
      setStatus("error");
    }
  }

  function rowToTask(row) {
    return { id: String(row.id), text: row.text || "", hour: row.hour || "", done: !!row.done, _dbId: row.id };
  }

  function setStatus(status) {
    saveStatus = status;
    const bar = root.querySelector(".status-bar");
    if (!bar) return;
    const statusLabel = {
      idle: "swipe or use arrows to change day",
      pending: "saving…",
      saved: "saved",
      error: "couldn't save — tap to retry"
    }[status];
    const statusIcon = status === "saved" ? icon("check") : "";
    bar.className = "status-bar" + (status === "error" ? " error" : "");
    bar.innerHTML = `${statusIcon}<span>${statusLabel}</span>`;
  }

  // Replace all rows for the given date with the given in-memory state.
  // Date key and task snapshot are captured at schedule time so a day change
  // before the debounce fires can never write one day's tasks into another day.
  let saveTimer = null;
  function scheduleSave() {
    setStatus("pending");
    if (saveTimer) clearTimeout(saveTimer);
    const targetKey = dateKey(current);
    const workSnapshot = work.map(t => ({ ...t }));
    const personalSnapshot = personal.map(t => ({ ...t }));
    saveTimer = setTimeout(() => {
      saveTimer = null;
      doSave(targetKey, workSnapshot, personalSnapshot);
    }, 500);
  }

  async function flushPendingSave() {
    if (!saveTimer) return;
    clearTimeout(saveTimer);
    saveTimer = null;
    const targetKey = dateKey(current);
    const workSnapshot = work.map(t => ({ ...t }));
    const personalSnapshot = personal.map(t => ({ ...t }));
    await doSave(targetKey, workSnapshot, personalSnapshot);
  }

  async function doSave(targetKey, workList, personalList) {
    try {
      await fetch(`${REST_URL}?date=eq.${targetKey}`, { method: "DELETE", headers: sbHeaders });

      const rows = [
        ...workList.map(t => ({ date: targetKey, section: "work", text: t.text, hour: t.hour, done: t.done })),
        ...personalList.map(t => ({ date: targetKey, section: "personal", text: t.text, hour: t.hour, done: t.done }))
      ];

      if (rows.length > 0) {
        const res = await fetch(REST_URL, {
          method: "POST",
          headers: { ...sbHeaders, "Prefer": "return=minimal" },
          body: JSON.stringify(rows)
        });
        if (!res.ok) throw new Error("insert failed");
      }
      setStatus("saved");
      setTimeout(() => { if (saveStatus === "saved") setStatus("idle"); }, 1000);
    } catch (e) {
      setStatus("error");
    }
  }

  async function shiftDay(delta) {
    await flushPendingSave();
    const d = new Date(current);
    d.setDate(d.getDate() + delta);
    current = d;
    await loadDay(current);
    render();
  }

  function icon(name) {
    const icons = {
      chevronLeft: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
      chevronRight: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
      plus: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
      x: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
      check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
    };
    return icons[name] || "";
  }

  function renderSection(title, tasks, key) {
    const sorted = [...tasks].sort((a, b) => (a.done === b.done ? 0 : a.done ? 1 : -1));
    let rowsHtml = "";
    if (sorted.length === 0) {
      rowsHtml = `<p class="empty-hint">No tasks</p>`;
    } else {
      rowsHtml = sorted.map(t => `
        <div class="task-row" data-id="${t.id}">
          <button class="check-btn ${t.done ? "done" : ""}" data-action="toggle" data-id="${t.id}" data-key="${key}">
            ${t.done ? icon("check") : ""}
          </button>
          <input class="task-text ${t.done ? "done" : ""}" data-action="text" data-id="${t.id}" data-key="${key}"
            value="${t.text.replace(/"/g, "&quot;")}" placeholder="Task..." enterkeyhint="next" ${t.id === focusId ? "autofocus" : ""} />
          <input class="hour-input" data-action="hour" data-id="${t.id}" data-key="${key}" value="${t.hour}" placeholder="hr" />
          <button class="del-btn" data-action="delete" data-id="${t.id}" data-key="${key}">${icon("x")}</button>
        </div>
      `).join("");
    }
    return `
      <div class="section">
        <div class="section-head">
          <h2>${title}</h2>
          <button class="add-btn" data-add="${key}">${icon("plus")} add</button>
        </div>
        <div class="task-list" data-list="${key}">
          ${rowsHtml}
          <button class="big-add" data-add="${key}" aria-label="Add ${title} task">+</button>
          <div class="spacer-tap" data-dismiss="1"></div>
        </div>
      </div>
    `;
  }

  function render() {
    closeTaskMenu();
    const statusLabel = {
      idle: "swipe or use arrows to change day",
      pending: "saving…",
      saved: "saved",
      error: "couldn't save — tap to retry"
    }[saveStatus];
    const statusIcon = saveStatus === "saved" ? icon("check") : "";

    root.innerHTML = `
      <div class="brand">Kenvelo Daily Planner</div>
      <div class="header">
        <button class="nav-btn" data-nav="-1">${icon("chevronLeft")}</button>
        <div class="date-label">
          <p>${fmt(current)}</p>
          <button class="today-btn" data-today="1">Today</button>
        </div>
        <button class="nav-btn" data-nav="1">${icon("chevronRight")}</button>
      </div>
      <div id="planner-scroll">
        ${renderSection("Work", work, "work")}
        <div class="divider"></div>
        ${renderSection("Personal", personal, "personal")}
        <div class="status-bar${saveStatus === "error" ? " error" : ""}">${statusIcon}<span>${statusLabel}</span></div>
      </div>
    `;

    root.querySelectorAll('[data-nav]').forEach(el => {
      el.addEventListener("click", () => shiftDay(parseInt(el.dataset.nav, 10)));
    });
    root.querySelector('[data-today]').addEventListener("click", async () => {
      await flushPendingSave();
      current = new Date();
      await loadDay(current);
      render();
    });

    // Only the explicit "add" and big "+" buttons create tasks.
    root.querySelectorAll('[data-add]').forEach(el => {
      el.addEventListener("click", () => addTask(el.dataset.add));
    });
    // Tapping empty space never adds a task; it just closes the keyboard.
    root.querySelectorAll('[data-dismiss]').forEach(el => {
      el.addEventListener("click", () => {
        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      });
    });

    root.querySelectorAll('[data-action="toggle"]').forEach(el => {
      el.addEventListener("click", () => {
        const list = el.dataset.key === "work" ? work : personal;
        const t = list.find(x => x.id === el.dataset.id);
        if (t) { t.done = !t.done; scheduleSave(); render(); }
      });
    });
    root.querySelectorAll('[data-action="delete"]').forEach(el => {
      el.addEventListener("click", () => {
        const key = el.dataset.key;
        if (key === "work") work = work.filter(x => x.id !== el.dataset.id);
        else personal = personal.filter(x => x.id !== el.dataset.id);
        scheduleSave();
        render();
      });
    });
    root.querySelectorAll('[data-action="text"]').forEach(el => {
      el.addEventListener("input", () => {
        const list = el.dataset.key === "work" ? work : personal;
        const t = list.find(x => x.id === el.dataset.id);
        if (t) { t.text = el.value; scheduleSave(); }
      });
      el.addEventListener("focus", () => {
        setTimeout(() => {
          el.scrollIntoView({ block: "center", behavior: "smooth" });
        }, 150);
      });
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          addTask(el.dataset.key);
        }
      });
      el.addEventListener("blur", () => { focusId = null; });
    });
    root.querySelectorAll('[data-action="hour"]').forEach(el => {
      el.addEventListener("input", () => {
        const list = el.dataset.key === "work" ? work : personal;
        const t = list.find(x => x.id === el.dataset.id);
        if (t) {
          const clean = el.value.replace(/[^0-9a-zA-Z-]/g, "").slice(0, 5);
          t.hour = clean;
          if (el.value !== clean) el.value = clean;
          scheduleSave();
        }
      });
    });

    const statusBarEl = root.querySelector(".status-bar");
    if (statusBarEl && saveStatus === "error") {
      statusBarEl.addEventListener("click", () => { flushPendingSave(); doSave(dateKey(current), work, personal); });
    }

    let longPressTimer = null;
    root.querySelectorAll(".task-row").forEach(rowEl => {
      const id = rowEl.dataset.id;
      const toggleBtn = rowEl.querySelector('[data-action="toggle"]');
      const key = toggleBtn ? toggleBtn.dataset.key : null;
      let startX = 0, startY = 0;
      const startPress = (e) => {
        // Never trigger the move-menu from the text input itself.
        if (e.target && e.target.dataset && e.target.dataset.action === "text") return;
        const x = e.touches ? e.touches[0].clientX : e.clientX;
        const y = e.touches ? e.touches[0].clientY : e.clientY;
        startX = x; startY = y;
        longPressTimer = setTimeout(() => {
          if (key) showTaskMenu(x, y, key, id);
        }, 550);
      };
      const cancelPress = () => { if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } };
      const moveCancel = (e) => {
        if (!longPressTimer) return;
        const x = e.touches ? e.touches[0].clientX : e.clientX;
        const y = e.touches ? e.touches[0].clientY : e.clientY;
        if (Math.abs(x - startX) > 10 || Math.abs(y - startY) > 10) cancelPress();
      };
      rowEl.addEventListener("touchstart", startPress, { passive: true });
      rowEl.addEventListener("touchend", cancelPress);
      rowEl.addEventListener("touchmove", moveCancel, { passive: true });
      rowEl.addEventListener("mousedown", startPress);
      rowEl.addEventListener("mouseup", cancelPress);
      rowEl.addEventListener("mouseleave", cancelPress);
      rowEl.addEventListener("mousemove", moveCancel);
    });

    const focusedInput = focusId && root.querySelector(`[data-action="text"][data-id="${focusId}"]`);
    if (focusedInput) {
      focusedInput.focus();
      focusId = null;
      setTimeout(() => focusedInput.scrollIntoView({ block: "center", behavior: "smooth" }), 150);
    }
  }

  function addTask(key) {
    const t = emptyTask();
    if (key === "work") work.push(t); else personal.push(t);
    focusId = t.id;
    scheduleSave();
    render();
  }

  // ---- Long-press menu ----
  function closeTaskMenu() {
    if (window._taskMenuEls) {
      window._taskMenuEls.forEach(el => el.remove());
      window._taskMenuEls = null;
    }
  }

  function showTaskMenu(x, y, key, id) {
    closeTaskMenu();
    const overlay = document.createElement("div");
    overlay.className = "task-menu-overlay";
    overlay.addEventListener("click", closeTaskMenu);
    document.body.appendChild(overlay);

    const menu = document.createElement("div");
    menu.className = "task-menu";
    menu.style.left = Math.max(8, Math.min(x, window.innerWidth - 210)) + "px";
    menu.style.top = Math.max(8, Math.min(y, window.innerHeight - 100)) + "px";
    menu.innerHTML = `
      <button data-move-tomorrow="1">Move to tomorrow →</button>
      <button data-move-other="1">Move to other day…</button>
    `;
    menu.querySelector("[data-move-tomorrow]").addEventListener("click", () => {
      const next = new Date(current);
      next.setDate(next.getDate() + 1);
      closeTaskMenu();
      moveTaskToDate(key, id, next);
    });
    menu.querySelector("[data-move-other]").addEventListener("click", () => {
      closeTaskMenu();
      showCalendar(key, id);
    });
    document.body.appendChild(menu);
    window._taskMenuEls = [overlay, menu];
  }

  // ---- Calendar picker for "Move to other day" ----
  function closeCalendar() {
    if (window._calEl) { window._calEl.remove(); window._calEl = null; }
  }

  function showCalendar(key, id) {
    closeCalendar();
    let viewYear = current.getFullYear();
    let viewMonth = current.getMonth();
    const todayKey = dateKey(new Date());
    const currentKey = dateKey(current);

    const overlay = document.createElement("div");
    overlay.className = "cal-overlay";
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeCalendar(); });
    const box = document.createElement("div");
    box.className = "cal-box";
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    window._calEl = overlay;

    function draw() {
      const first = new Date(viewYear, viewMonth, 1);
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      const lead = first.getDay();
      const monthLabel = first.toLocaleDateString(undefined, { month: "long", year: "numeric" });
      const dows = ["S","M","T","W","T","F","S"].map(d => `<div class="cal-dow">${d}</div>`).join("");
      let cells = "";
      for (let i = 0; i < lead; i++) cells += `<div></div>`;
      for (let day = 1; day <= daysInMonth; day++) {
        const k = dateKey(new Date(viewYear, viewMonth, day));
        const cls = "cal-day" + (k === todayKey ? " today" : "") + (k === currentKey ? " current" : "");
        cells += `<button class="${cls}" data-day="${day}">${day}</button>`;
      }
      box.innerHTML = `
        <p class="cal-title">Move task to…</p>
        <div class="cal-head">
          <button class="nav-btn" data-cal="-1">${icon("chevronLeft")}</button>
          <span>${monthLabel}</span>
          <button class="nav-btn" data-cal="1">${icon("chevronRight")}</button>
        </div>
        <div class="cal-grid">${dows}${cells}</div>
        <button class="cal-cancel" data-cal-cancel="1">Cancel</button>
      `;
      box.querySelectorAll("[data-cal]").forEach(b => b.addEventListener("click", () => {
        viewMonth += parseInt(b.dataset.cal, 10);
        if (viewMonth < 0) { viewMonth = 11; viewYear--; }
        if (viewMonth > 11) { viewMonth = 0; viewYear++; }
        draw();
      }));
      box.querySelector("[data-cal-cancel]").addEventListener("click", closeCalendar);
      box.querySelectorAll("[data-day]").forEach(b => b.addEventListener("click", () => {
        const target = new Date(viewYear, viewMonth, parseInt(b.dataset.day, 10));
        if (dateKey(target) === currentKey) return; // same day: nothing to move
        closeCalendar();
        moveTaskToDate(key, id, target);
      }));
    }
    draw();
  }

  // Move a task to another day, keeping it in the same category (work/personal).
  async function moveTaskToDate(key, id, targetDate) {
    const list = key === "work" ? work : personal;
    const idx = list.findIndex(x => x.id === id);
    if (idx === -1) return;
    const [t] = list.splice(idx, 1);
    scheduleSave(); // persists the removal from the current day
    render();

    try {
      await fetch(REST_URL, {
        method: "POST",
        headers: { ...sbHeaders, "Prefer": "return=minimal" },
        body: JSON.stringify([{ date: dateKey(targetDate), section: key, text: t.text, hour: t.hour, done: t.done }])
      });
    } catch (e) { /* best effort */ }
  }

  // swipe navigation
  let startX = 0;
  root.addEventListener("touchstart", (e) => { startX = e.touches[0].clientX; });
  root.addEventListener("touchend", (e) => {
    const dx = e.changedTouches[0].clientX - startX;
    if (dx > 60) shiftDay(-1);
    else if (dx < -60) shiftDay(1);
  });

  if (window.visualViewport) {
    const applyKeyboardOffset = () => {
      const offset = Math.max(0, window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop);
      document.documentElement.style.setProperty("--kb-offset", offset + "px");
    };
    window.visualViewport.addEventListener("resize", applyKeyboardOffset);
    window.visualViewport.addEventListener("scroll", applyKeyboardOffset);
  }

  window.addEventListener("beforeunload", () => {
    if (saveTimer) {
      clearTimeout(saveTimer);
      saveTimer = null;
      doSave(dateKey(current), work, personal);
    }
  });

  (async function init() {
    await loadDay(current);
    render();
  })();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>

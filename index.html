<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kenvelo Daily Planner</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#334155">
<style>
  :root {
    --slate-50:#f8fafc; --slate-100:#f1f5f9; --slate-200:#e2e8f0; --slate-300:#cbd5e1;
    --slate-400:#94a3b8; --slate-500:#64748b; --slate-700:#334155; --slate-800:#1e293b;
    --red-400:#f87171; --red-500:#ef4444;
    --kb-offset: 0px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--slate-50);
  }
  #planner-root {
    height: 100vh; width: 100%; background: #fff; display: flex; flex-direction: column;
    max-width: 448px; margin: 0 auto; border-left: 1px solid var(--slate-100); border-right: 1px solid var(--slate-100);
    overflow: hidden;
  }
  #planner-scroll {
    flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column;
  }
  .brand {
    text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 0.04em;
    color: var(--slate-700); padding: 10px 16px 0;
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--slate-100);
  }
  .nav-btn {
    padding: 4px; color: var(--slate-400); background: none; border: none; cursor: pointer;
    display: flex; align-items: center; border-radius: 6px;
  }
  .nav-btn:hover { color: var(--slate-700); background: var(--slate-100); }
  .date-label { text-align: center; }
  .date-label p { margin: 0; font-size: 14px; font-weight: 600; color: var(--slate-800); }
  .today-btn {
    font-size: 11px; color: var(--slate-400); background: none; border: none; cursor: pointer; margin-top: 2px;
  }
  .today-btn:hover { color: var(--slate-500); }
  .section { display: flex; flex-direction: column; flex-shrink: 0; }
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px 8px;
  }
  .section-head h2 {
    margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
    color: var(--slate-500); text-transform: uppercase;
  }
  .add-btn {
    color: var(--slate-400); background: none; border: none; cursor: pointer;
    display: flex; align-items: center; gap: 4px; font-size: 12px;
  }
  .add-btn:hover { color: var(--slate-700); }
  .task-list {
    padding: 0 16px 12px;
    scroll-margin-bottom: 60px;
  }
  .empty-hint { font-size: 14px; color: var(--slate-300); font-style: italic; padding: 8px 4px; cursor: pointer; margin: 0; }
  .task-row {
    display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--slate-100); padding: 6px 0;
  }
  .check-btn {
    width: 20px; height: 20px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--slate-300);
    background: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .check-btn.done { background: var(--slate-700); border-color: var(--slate-700); color: #fff; font-size: 10px; }
  .task-text {
    flex: 1; min-width: 0; font-size: 14px; border: none; background: transparent; color: var(--slate-800); outline: none;
  }
  .task-text.done { text-decoration: line-through; color: var(--slate-400); }
  .hour-input {
    width: 44px; text-align: center; font-size: 12px; background: var(--slate-100); border: none; border-radius: 6px;
    padding: 4px; color: var(--slate-500); outline: none;
  }
  .hour-input:focus { box-shadow: 0 0 0 1px var(--slate-400); }
  .del-btn { color: var(--slate-300); background: none; border: none; cursor: pointer; flex-shrink: 0; display:flex; }
  .del-btn:hover { color: var(--red-500); }
  .task-menu {
    position: fixed; z-index: 50; background: #fff; border: 1px solid var(--slate-200);
    border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); overflow: hidden;
  }
  .task-menu button {
    display: block; width: 100%; text-align: left; padding: 10px 16px; font-size: 14px;
    background: none; border: none; cursor: pointer; color: var(--slate-800); white-space: nowrap;
  }
  .task-menu button:hover { background: var(--slate-100); }
  .task-menu-overlay { position: fixed; inset: 0; z-index: 40; background: transparent; }
  .spacer-tap {
    height: calc(56px + var(--kb-offset));
    width: 100%; cursor: text;
    transition: height 0.15s ease;
  }
  .divider { height: 1px; background: var(--slate-200); }
  .status-bar {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    font-size: 11px; padding: 6px 8px; color: var(--slate-400);
    flex-shrink: 0;
  }
  .status-bar.error { color: var(--red-500); cursor: pointer; text-decoration: underline; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
</style>
</head>
<body>
<div id="planner-root"></div>

<script>
(function() {
  // ---- Supabase connection ----
  const SUPABASE_URL = "https://xxrbbhrvrjjaobahvlaf.supabase.co";
  const SUPABASE_KEY = "sb_publishable_FkMIVN_l0KZy5k99B36ZVA_AJyUzhtl";
  const REST_URL = SUPABASE_URL + "/rest/v1/tasks";
  const sbHeaders = {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json"
  };

  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Math.random().toString(36).slice(2));
  const dateKey = (d) => {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  };
  const fmt = (d) => d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  const emptyTask = () => ({ id: uuid(), text: "", hour: "", done: false });

  const root = document.getElementById("planner-root");
  let current = new Date();
  let work = [];
  let personal = [];
  let saveStatus = "idle"; // idle | pending | saved | error
  let focusId = null;

  // Load all tasks for a given day from Supabase
  async function loadDay(d) {
    const key = dateKey(d);
    try {
      const res = await fetch(`${REST_URL}?date=eq.${key}&select=*`, { headers: sbHeaders });
      if (!res.ok) throw new Error("load failed");
      const rows = await res.json();
      work = rows.filter(r => r.section === "work").map(rowToTask);
      personal = rows.filter(r => r.section === "personal").map(rowToTask);
    } catch (e) {
      work = []; personal = [];
      setStatus("error");
    }
  }

  function rowToTask(row) {
    return { id: String(row.id), text: row.text || "", hour: row.hour || "", done: !!row.done, _dbId: row.id };
  }

  function setStatus(status) {
    saveStatus = status;
    const bar = root.querySelector(".status-bar");
    if (!bar) return;
    const statusLabel = {
      idle: "swipe or use arrows to change day",
      pending: "saving…",
      saved: "saved",
      error: "couldn't save — tap to retry"
    }[status];
    const statusIcon = status === "saved" ? icon("check") : "";
    bar.className = "status-bar" + (status === "error" ? " error" : "");
    bar.innerHTML = `${statusIcon}<span>${statusLabel}</span>`;
  }

  // Replace all rows for the given date with the given in-memory state.
  // Simple approach: delete existing rows for this date, then insert current ones.
  // IMPORTANT: both the date key and the task snapshot are captured at schedule
  // time (not at execution time), so a day change before the debounce fires
  // can never write one day's tasks into another day's slot.
  let saveTimer = null;
  function scheduleSave() {
    setStatus("pending");
    if (saveTimer) clearTimeout(saveTimer);
    const targetKey = dateKey(current);
    const workSnapshot = work.map(t => ({ ...t }));
    const personalSnapshot = personal.map(t => ({ ...t }));
    saveTimer = setTimeout(() => {
      saveTimer = null;
      doSave(targetKey, workSnapshot, personalSnapshot);
    }, 500);
  }

  // Cancel any pending debounced save and run it immediately, using the
  // exact data/date it was scheduled with. Call this before switching days
  // so an in-flight edit never lands on the wrong day.
  async function flushPendingSave() {
    if (!saveTimer) return;
    clearTimeout(saveTimer);
    saveTimer = null;
    const targetKey = dateKey(current);
    const workSnapshot = work.map(t => ({ ...t }));
    const personalSnapshot = personal.map(t => ({ ...t }));
    await doSave(targetKey, workSnapshot, personalSnapshot);
  }

  async function doSave(targetKey, workList, personalList) {
    try {
      // delete existing rows for this day
      await fetch(`${REST_URL}?date=eq.${targetKey}`, { method: "DELETE", headers: sbHeaders });

      const rows = [
        ...workList.map(t => ({ date: targetKey, section: "work", text: t.text, hour: t.hour, done: t.done })),
        ...personalList.map(t => ({ date: targetKey, section: "personal", text: t.text, hour: t.hour, done: t.done }))
      ];

      if (rows.length > 0) {
        const res = await fetch(REST_URL, {
          method: "POST",
          headers: { ...sbHeaders, "Prefer": "return=minimal" },
          body: JSON.stringify(rows)
        });
        if (!res.ok) throw new Error("insert failed");
      }
      setStatus("saved");
      setTimeout(() => { if (saveStatus === "saved") setStatus("idle"); }, 1000);
    } catch (e) {
      setStatus("error");
    }
  }

  async function shiftDay(delta) {
    await flushPendingSave();
    const d = new Date(current);
    d.setDate(d.getDate() + delta);
    current = d;
    await loadDay(current);
    render();
  }

  function icon(name) {
    const icons = {
      chevronLeft: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
      chevronRight: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
      plus: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
      x: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
      check: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
    };
    return icons[name] || "";
  }

  function renderSection(title, tasks, key) {
    const sorted = [...tasks].sort((a, b) => (a.done === b.done ? 0 : a.done ? 1 : -1));
    let rowsHtml = "";
    if (sorted.length === 0) {
      rowsHtml = `<p class="empty-hint" data-add="${key}">Tap to add a task</p>`;
    } else {
      rowsHtml = sorted.map(t => `
        <div class="task-row" data-id="${t.id}">
          <button class="check-btn ${t.done ? "done" : ""}" data-action="toggle" data-id="${t.id}" data-key="${key}">
            ${t.done ? icon("check") : ""}
          </button>
          <input class="task-text ${t.done ? "done" : ""}" data-action="text" data-id="${t.id}" data-key="${key}"
            value="${t.text.replace(/"/g, "&quot;")}" placeholder="Task..." enterkeyhint="next" ${t.id === focusId ? "autofocus" : ""} />
          <input class="hour-input" data-action="hour" data-id="${t.id}" data-key="${key}" value="${t.hour}" placeholder="hr" />
          <button class="del-btn" data-action="delete" data-id="${t.id}" data-key="${key}">${icon("x")}</button>
        </div>
      `).join("");
    }
    return `
      <div class="section">
        <div class="section-head">
          <h2>${title}</h2>
          <button class="add-btn" data-add="${key}">${icon("plus")} add</button>
        </div>
        <div class="task-list" data-list="${key}">
          ${rowsHtml}
          <div class="spacer-tap" data-add="${key}"></div>
        </div>
      </div>
    `;
  }

  function render() {
    closeTaskMenu();
    const statusLabel = {
      idle: "swipe or use arrows to change day",
      pending: "saving…",
      saved: "saved",
      error: "couldn't save — tap to retry"
    }[saveStatus];
    const statusIcon = saveStatus === "saved" ? icon("check") : "";

    root.innerHTML = `
      <div class="brand">Kenvelo Daily Planner</div>
      <div class="header">
        <button class="nav-btn" data-nav="-1">${icon("chevronLeft")}</button>
        <div class="date-label">
          <p>${fmt(current)}</p>
          <button class="today-btn" data-today="1">Today</button>
        </div>
        <button class="nav-btn" data-nav="1">${icon("chevronRight")}</button>
      </div>
      <div id="planner-scroll">
        ${renderSection("Work", work, "work")}
        <div class="divider"></div>
        ${renderSection("Personal", personal, "personal")}
        <div class="status-bar${saveStatus === "error" ? " error" : ""}">${statusIcon}<span>${statusLabel}</span></div>
      </div>
    `;

    root.querySelectorAll('[data-nav]').forEach(el => {
      el.addEventListener("click", () => shiftDay(parseInt(el.dataset.nav, 10)));
    });
    root.querySelector('[data-today]').addEventListener("click", async () => {
      await flushPendingSave();
      current = new Date();
      await loadDay(current);
      render();
    });
    root.querySelectorAll('[data-add]').forEach(el => {
      // "Empty space" taps (bottom spacer, or the empty-state hint text) should
      // just dismiss the keyboard on the first tap, and only create a task on
      // a second, deliberate tap. The explicit "add" button always adds right away.
      const isEmptySpace = el.classList.contains("spacer-tap") || el.classList.contains("empty-hint");
      let inputWasFocused = false;
      if (isEmptySpace) {
        // Must capture BEFORE the click fires: the browser blurs the focused
        // input as part of mousedown/touchstart's default action, so by the
        // time "click" runs, document.activeElement is already gone.
        const captureFocus = () => {
          const active = document.activeElement;
          inputWasFocused = !!(active && active.classList && active.classList.contains("task-text"));
        };
        el.addEventListener("touchstart", captureFocus, { passive: true });
        el.addEventListener("mousedown", captureFocus);
      }
      el.addEventListener("click", (e) => {
        if (e.target !== el && el.classList.contains("task-list")) return;
        const key = el.dataset.add;
        if (isEmptySpace && inputWasFocused) {
          inputWasFocused = false;
          if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
          return; // first tap: just dismiss the keyboard
        }
        addTask(key); // second tap (keyboard already down), or tapping "add" directly
      });
    });
    root.querySelectorAll('[data-action="toggle"]').forEach(el => {
      el.addEventListener("click", () => {
        const list = el.dataset.key === "work" ? work : personal;
        const t = list.find(x => x.id === el.dataset.id);
        if (t) { t.done = !t.done; scheduleSave(); render(); }
      });
    });
    root.querySelectorAll('[data-action="delete"]').forEach(el => {
      el.addEventListener("click", () => {
        const key = el.dataset.key;
        if (key === "work") work = work.filter(x => x.id !== el.dataset.id);
        else personal = personal.filter(x => x.id !== el.dataset.id);
        scheduleSave();
        render();
      });
    });
    root.querySelectorAll('[data-action="text"]').forEach(el => {
      el.addEventListener("input", () => {
        const list = el.dataset.key === "work" ? work : personal;
        const t = list.find(x => x.id === el.dataset.id);
        if (t) { t.text = el.value; scheduleSave(); }
      });
      el.addEventListener("focus", () => {
        setTimeout(() => {
          el.scrollIntoView({ block: "center", behavior: "smooth" });
        }, 150);
      });
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          addTask(el.dataset.key);
        }
      });
      el.addEventListener("blur", () => { focusId = null; });
    });
    root.querySelectorAll('[data-action="hour"]').forEach(el => {
      el.addEventListener("input", () => {
        const list = el.dataset.key === "work" ? work : personal;
        const t = list.find(x => x.id === el.dataset.id);
        if (t) {
          const clean = el.value.replace(/[^0-9a-zA-Z-]/g, "").slice(0, 5);
          t.hour = clean;
          if (el.value !== clean) el.value = clean;
          scheduleSave();
        }
      });
    });

    const statusBarEl = root.querySelector(".status-bar");
    if (statusBarEl && saveStatus === "error") {
      statusBarEl.addEventListener("click", () => { flushPendingSave(); doSave(dateKey(current), work, personal); });
    }

    let longPressTimer = null;
    root.querySelectorAll(".task-row").forEach(rowEl => {
      const id = rowEl.dataset.id;
      const toggleBtn = rowEl.querySelector('[data-action="toggle"]');
      const key = toggleBtn ? toggleBtn.dataset.key : null;
      const startPress = (e) => {
        const x = e.touches ? e.touches[0].clientX : e.clientX;
        const y = e.touches ? e.touches[0].clientY : e.clientY;
        longPressTimer = setTimeout(() => {
          if (key) showTaskMenu(x, y, key, id);
        }, 550);
      };
      const cancelPress = () => { if (longPressTimer) clearTimeout(longPressTimer); };
      rowEl.addEventListener("touchstart", startPress, { passive: true });
      rowEl.addEventListener("touchend", cancelPress);
      rowEl.addEventListener("touchmove", cancelPress);
      rowEl.addEventListener("mousedown", startPress);
      rowEl.addEventListener("mouseup", cancelPress);
      rowEl.addEventListener("mouseleave", cancelPress);
    });

    const focusedInput = focusId && root.querySelector(`[data-action="text"][data-id="${focusId}"]`);
    if (focusedInput) {
      focusedInput.focus();
      focusId = null;
      setTimeout(() => focusedInput.scrollIntoView({ block: "center", behavior: "smooth" }), 150);
    }
  }

  function addTask(key) {
    const t = emptyTask();
    if (key === "work") work.push(t); else personal.push(t);
    focusId = t.id;
    scheduleSave();
    render();
  }

  function closeTaskMenu() {
    if (window._taskMenuEls) {
      window._taskMenuEls.forEach(el => el.remove());
      window._taskMenuEls = null;
    }
  }

  function showTaskMenu(x, y, key, id) {
    closeTaskMenu();
    const overlay = document.createElement("div");
    overlay.className = "task-menu-overlay";
    overlay.addEventListener("click", closeTaskMenu);
    document.body.appendChild(overlay);

    const menu = document.createElement("div");
    menu.className = "task-menu";
    menu.style.left = Math.min(x, window.innerWidth - 190) + "px";
    menu.style.top = Math.min(y, window.innerHeight - 50) + "px";
    menu.innerHTML = `<button data-move="1">Move to tomorrow →</button>`;
    menu.querySelector("[data-move]").addEventListener("click", () => {
      moveTaskToNextDay(key, id);
      closeTaskMenu();
    });
    document.body.appendChild(menu);
    window._taskMenuEls = [overlay, menu];
  }

  async function moveTaskToNextDay(key, id) {
    const list = key === "work" ? work : personal;
    const idx = list.findIndex(x => x.id === id);
    if (idx === -1) return;
    const [t] = list.splice(idx, 1);
    scheduleSave(); // persists the removal from the current day
    render();

    const nextDate = new Date(current);
    nextDate.setDate(nextDate.getDate() + 1);
    const nextKey = dateKey(nextDate);
    try {
      await fetch(REST_URL, {
        method: "POST",
        headers: { ...sbHeaders, "Prefer": "return=minimal" },
        body: JSON.stringify([{ date: nextKey, section: key, text: t.text, hour: t.hour, done: t.done }])
      });
    } catch (e) { /* best effort — task will still show if user navigates and it partially failed */ }
  }

  // swipe navigation
  let startX = 0;
  root.addEventListener("touchstart", (e) => { startX = e.touches[0].clientX; });
  root.addEventListener("touchend", (e) => {
    const dx = e.changedTouches[0].clientX - startX;
    if (dx > 60) shiftDay(-1);
    else if (dx < -60) shiftDay(1);
  });

  if (window.visualViewport) {
    const applyKeyboardOffset = () => {
      const offset = Math.max(0, window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop);
      document.documentElement.style.setProperty("--kb-offset", offset + "px");
    };
    window.visualViewport.addEventListener("resize", applyKeyboardOffset);
    window.visualViewport.addEventListener("scroll", applyKeyboardOffset);
  }

  // best-effort flush of any pending save on close
  window.addEventListener("beforeunload", () => {
    if (saveTimer) {
      clearTimeout(saveTimer);
      saveTimer = null;
      doSave(dateKey(current), work, personal);
    }
  });

  (async function init() {
    await loadDay(current);
    render();
  })();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
